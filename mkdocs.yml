site_name: TA-splunk_to_fusion
site_description: Splunk ES 8 to CrowdStrike Falcon Fusion SOAR & Next-Gen SIEM Add-on
site_author: Cyber Security Architecture & Engineering
repo_name: SecurityFodder/splunk_to_fusion
repo_url: https://github.com/SecurityFodder/splunk_to_fusion

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Overview: index.md
  - Guides & Tutorials:
      - Setup & Onboarding: TUTORIAL_SETUP.md
      - ES 8 Automation: PROCEDURE_AUTOMATION_ES8.md
  - Runbooks & SOPs:
      - Operations Runbook: OPERATIONS_RUNBOOK.md
      - CA Certificate Rotation: PROCEDURE_CERTIFICATE_UPDATE.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
