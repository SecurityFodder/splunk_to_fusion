# s2f_logs: Every delivery and error log line written by this app.
# Used by the dashboards and health alerts. Scope it to a tenant by adding
# event_id or rule_name filters, or filter on delivery_method.
[s2f_logs]
definition = index=_internal (sourcetype="send_to_fusion" OR sourcetype="modular_alerts:send_to_fusion" OR source="*send_to_fusion.log")
iseval = 0

# s2f_notable_index: Wrapper around the ES notable macro. Override this in
# local/macros.conf if your notables live in a non-default index.
[s2f_notable_index]
definition = `notable`
iseval = 0
