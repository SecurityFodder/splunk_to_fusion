# server.conf: Search Head Clustering (SHC) Replication Rules
# ----------------------------------------------------------------------------
# In a Splunk Search Head Cluster (SHC), configuration files edited on one
# search head (such as when an administrator saves settings on the Setup page)
# must replicate automatically across all other member search heads in the cluster.
#
# By default, Splunk only replicates standard system configs (savedsearches, macros).
# Custom configuration files like 'ta_splunk_to_fusion.conf' will NOT replicate
# unless explicitly declared in server.conf.
# ----------------------------------------------------------------------------

[shclustering]
# conf_replication_include.ta_splunk_to_fusion = true
# Why: Ensures that when an admin configures the Falcon Cloud region, default workflow,
# or proxy URLs via the Setup page on one Search Head, the updated settings are
# immediately synced to every other Search Head in the cluster. Without this,
# alert actions running on other cluster members would fail or use outdated settings.
conf_replication_include.ta_splunk_to_fusion = true
