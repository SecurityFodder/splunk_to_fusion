[Fusion - Auto Forward High and Critical Notables]
disabled = 1
description = Polls the ES notable macro for new High/Critical notable events not yet sent to CrowdStrike and triggers the Send to CrowdStrike Fusion action.
search = `s2f_notable_index` urgency IN ("high", "critical") | search NOT [ search `s2f_logs` status=success (action=execute_workflow OR action=send_hec OR action=create_case OR action=save_ioc) | fields event_id ] | table _time, event_id, rule_id, rule_name, urgency, severity, security_domain, status_label, owner, src, dest, user
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
action.send_to_fusion = 1
action.send_to_fusion.param.delivery_method = fusion_workflow
action.send_to_fusion.param.comment = Auto-forwarded by Fusion saved search

[Fusion - High Failure Rate Alert]
disabled = 1
description = Alerts when more than 10% of notable event transmissions to CrowdStrike fail within a 15-minute window.
search = `s2f_logs` (action=execute_workflow OR action=send_hec OR action=create_case OR action=save_ioc) | stats count(eval(status="failure")) as failure_count, count as total_count | where total_count >= 5 AND (failure_count / total_count) > 0.10
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
action.email = 0

[Fusion - Authentication Failure Alert]
disabled = 1
description = Alerts immediately if CrowdStrike returns HTTP 401/403 (e.g. expired API client secret or invalid permissions).
search = `s2f_logs` status=failure (status_code=401 OR status_code=403 OR "Invalid client")
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 1h
action.email = 0

[Fusion - Proxy or TLS Failure Alert]
disabled = 1
description = Alerts if outbound requests to CrowdStrike fail due to corporate proxy issues or invalid SSL interception CA certificates.
search = `s2f_logs` status=failure ("SSLError" OR "certificate" OR "Proxy" OR "407")
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
action.email = 0

[Fusion - Daily Operational Summary]
disabled = 1
description = Daily summary report of CrowdStrike workflow, HEC, case, and IOC dispatches, success rates, and latency.
search = `s2f_logs` (action=execute_workflow OR action=send_hec OR action=create_case OR action=save_ioc) | stats count as "Total Dispatches", count(eval(status="success")) as "Successful", count(eval(status="failure")) as "Failed", avg(duration_ms) as "Avg Latency (ms)" by delivery_method | eval "Avg Latency (ms)"=round('Avg Latency (ms)', 0), "Success %"=round(('Successful' / 'Total Dispatches') * 100, 1)
cron_schedule = 0 7 * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0



