# authorize.conf: Custom Capabilities and Role Assignments
# ----------------------------------------------------------------------------
# In Splunk, authorize.conf defines role-based access control (RBAC). It creates
# custom capabilities (granular permissions) and maps them to built-in or
# enterprise security roles.
#
# Why this is critical for Enterprise security model:
# Splunk's default credential store (storage/passwords) requires the very
# powerful 'list_storage_passwords' capability to read credentials. Enterprise policy
# strictly forbids granting 'list_storage_passwords' to tier-1/tier-2 analysts.
#
# To solve this, we create two least-privilege custom capabilities:
# 1. s2f_send: Allows analysts to trigger dispatches via our broker without
#              ever seeing, touching, or having direct access to passwords.
# 2. s2f_admin: Allows administrators to view/edit app settings and credentials.
# ----------------------------------------------------------------------------

# 1. Register the custom capability names with Splunk:
[capability::s2f_send]
[capability::s2f_admin]

# 2. Grant s2f_send to standard Enterprise Security Analysts:
# Why: Allows SOC analysts using the Enterprise Security Mission Control /
# Incident Review queue to trigger on-demand CrowdStrike workflows.
[role_ess_analyst]
s2f_send = enabled

# 3. Grant both s2f_send and s2f_admin to Enterprise Security Admins:
# Why: ES Administrators need to test dispatches and configure CrowdStrike
# credentials, proxy settings, and defaults on the Setup page.
[role_ess_admin]
s2f_send = enabled
s2f_admin = enabled

# 4. Grant both capabilities to standard Splunk Administrators:
[role_admin]
s2f_send = enabled
s2f_admin = enabled

# 5. Grant both capabilities to Splunk Cloud Administrators (sc_admin):
# Why: Splunk Cloud environments use 'sc_admin' rather than standard 'admin'.
[role_sc_admin]
s2f_send = enabled
s2f_admin = enabled
