# ta_splunk_to_fusion.conf: Application Configuration
# ----------------------------------------------------------------------------
# This app uses two kinds of stanzas:
#
#   [settings]      The default CrowdStrike tenant.
#   [cid:<name>]    Additional tenants, one stanza per CrowdStrike CID.
#
# A [cid:<name>] stanza can override any [settings] key. Values that are not
# set in a [cid:...] stanza fall back to [settings] at dispatch time.
#
# The Configuration page in Splunk Web writes changes to
# local/ta_splunk_to_fusion.conf. Secrets are stored in Splunk's encrypted
# credential store (storage/passwords), never in this file:
#   - Each client secret is stored under its OAuth2 client ID.
#   - Each HEC token is stored as hec_token:<cid>.
#   - An optional shared proxy URL credential is stored as proxy_url.
# ----------------------------------------------------------------------------

[settings]
# falcon_cloud: The CrowdStrike Falcon cloud environment hosting this tenant.
# Supported standard regions:
#   - eu-1: Frankfurt (api.eu-1.crowdstrike.com)
#   - us-1: US Commercial (api.crowdstrike.com)
#   - us-2: US Commercial Alternative (api.us-2.crowdstrike.com)
#   - us-gov-1: US GovCloud (api.laggar.gcw.crowdstrike.com)
#   - us-gov-2: US GovCloud (api.us-gov-2.crowdstrike.mil)
# You can also enter a custom base URL (e.g. https://api.my-tenant.crowdstrike.com).
falcon_cloud = eu-1

# client_id: CrowdStrike Falcon API OAuth2 Client ID.
# Create it in Falcon Console under Support and resources > API clients and keys.
# Grant Workflows: Write and Next-Gen SIEM: Write. Add the Cases and IOC
# scopes when alert actions create cases or save IOCs.
client_id = 

# default_workflow: The workflow used when the alert action does not override it.
# Use the 32-character definition ID (recommended) or the workflow name.
default_workflow = 

# ngsiem_hec_url: Full HTTPS URL of the CrowdStrike Next-Gen SIEM HEC endpoint.
# Required only when the alert action's delivery_method is ngsiem_hec or both.
# Example: https://hec.eu-1.crowdstrike.com/services/collector
ngsiem_hec_url = 

# proxy_url: Optional corporate HTTP/HTTPS forward proxy for this tenant.
# Example: http://proxy.example.com:8080 or http://user@proxy.example.com:8080
# Include proxy credentials in the URL if the proxy requires them. The shared
# proxy_url credential entry in storage/passwords is used as a fallback.
proxy_url = 

# ca_bundle_path: Optional path to a custom CA bundle for SSL/TLS inspection.
# When left empty, the app loads every .pem and .crt file from its certs/
# directory. Set this only when you need a specific system-wide bundle
# (e.g. /etc/pki/tls/certs/ca-bundle.crt).
ca_bundle_path = 

# ----------------------------------------------------------------------------
# Additional tenants
# ----------------------------------------------------------------------------
# Add one [cid:<name>] stanza per additional CrowdStrike tenant. <name> is the
# value you set in the alert action's cid parameter. Any [settings] key can be
# overridden per tenant. Secrets remain per tenant: the client secret is stored
# under the tenant's client_id, and the HEC token is stored as hec_token:<name>.
#
# Example:
# [cid:tenant-a]
# falcon_cloud = us-1
# client_id = 32-character-client-id
# default_workflow = Incident_Intake_Workflow
# ngsiem_hec_url = https://hec.us-1.crowdstrike.com/services/collector
# proxy_url = http://proxy.example.com:8080
# ca_bundle_path =
