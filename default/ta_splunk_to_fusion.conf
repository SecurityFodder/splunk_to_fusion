# ta_splunk_to_fusion.conf: Default Application Configuration
# ----------------------------------------------------------------------------
# This file stores non-sensitive configuration defaults for the add-on.
# When administrators configure the app using the Setup page in Splunk Web,
# changes are written to local/ta_splunk_to_fusion.conf.
#
# IMPORTANT SECURITY NOTE:
# Sensitive secrets (OAuth2 Client Secret, Proxy Password, Next-Gen SIEM HEC Token)
# are NEVER saved in this plaintext file. They are stored securely in Splunk's
# encrypted credential store (services/storage/passwords).
# ----------------------------------------------------------------------------

[settings]
# falcon_cloud: The CrowdStrike Falcon cloud environment hosting your tenant.
# Supported standard regions:
#   - eu-1: Frankfurt (Primary EU tenant, api.eu-1.crowdstrike.com)
#   - us-1: US Commercial (api.crowdstrike.com)
#   - us-2: US Commercial Alternative (api.us-2.crowdstrike.com)
#   - us-gov-1 / us-gov-2: US GovCloud
# You can also enter a custom base URL (e.g. https://api.my-tenant.crowdstrike.com).
falcon_cloud = eu-1

# client_id: CrowdStrike Falcon API OAuth2 Client ID.
# Generated in Falcon Console under Support & resources > API clients and keys.
# Needs 'Workflows: Write' and 'CrowdStrike Next-Gen SIEM: Write' scopes.
client_id = 

# default_workflow: The fallback workflow executed when a detection does not
# specify an override. Can be a 32-character definition ID (recommended) or
# a human-readable workflow Name.
default_workflow = 

# delivery_method: Primary event delivery path:
#   - fusion_workflow: Triggers an automated Falcon Fusion SOAR playbook.
#   - ngsiem_hec: Forwards raw finding data to Falcon Next-Gen SIEM via HEC.
#   - both: Sends to both Fusion SOAR and Next-Gen SIEM concurrently.
delivery_method = fusion_workflow

# ngsiem_hec_url: Full HTTPS URL of the CrowdStrike Next-Gen SIEM HEC endpoint
# (e.g., https://hec.eu-1.crowdstrike.com/services/collector).
ngsiem_hec_url = 

# ngsiem_hec_auth_scheme: Authentication header scheme for the HEC token.
# CrowdStrike Falcon typically requires "Bearer", while native Splunk HEC uses "Splunk".
ngsiem_hec_auth_scheme = Bearer

# proxy_url: Corporate HTTP/HTTPS forward proxy URL.
# Example: http://proxy.example.com:8080 or http://user@proxy.example.com:8080
# If your proxy requires authentication, the proxy password is saved in Splunk's
# encrypted password storage, not in this file.
proxy_url = 

# ca_bundle_path: Path to custom CA certificate bundle for SSL/TLS inspection.
# When left empty, the add-on automatically inspects the certs/ directory in the
# app root and bundles any .pem or .crt files found there. Only specify this setting
# if you need to point to a system-wide CA bundle (e.g., /etc/pki/tls/certs/ca-bundle.crt).
ca_bundle_path = 
