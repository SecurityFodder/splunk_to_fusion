# app.conf: Splunk Application Metadata & Packaging Configuration
# ----------------------------------------------------------------------------
# In Splunk, app.conf tells the platform the app's ID, version, visibility in
# the Apps menu, which dashboard serves as the Setup page, and which custom
# .conf files can be reloaded without a full Splunk restart.
# ----------------------------------------------------------------------------

[id]
name = TA-splunk_to_fusion
version = 1.0.0

[install]
# is_configured = 0: Starts unconfigured; s2f_broker.py sets this to 1 in
# local/app.conf once an administrator saves settings on the Configuration page.
is_configured = 0
state = enabled
build = 1

[launcher]
author = Security Operations
description = Splunk ES 8 Integration for CrowdStrike Falcon Fusion SOAR, Next-Gen SIEM, Cases, and IOC Management
version = 1.0.0

[ui]
# is_visible = 1: Shows the app in the Splunk Web Apps menu so analysts and
# admins can open the Operational Overview, System Health, and Configuration views.
is_visible = 1
label = Splunk to CrowdStrike Fusion
setup_view = fusion_setup

[package]
id = TA-splunk_to_fusion
check_for_updates = 0

[triggers]
# Allows custom configuration changes in ta_splunk_to_fusion.conf to reload
# without requiring a full splunkd restart.
reload.ta_splunk_to_fusion = simple
