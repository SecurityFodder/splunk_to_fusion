# alert_actions.conf: Modular Alert / Adaptive Response Action Definition
# ----------------------------------------------------------------------------
# In Splunk, alert_actions.conf registers custom alert actions that can be
# attached to saved searches, correlation searches, or executed on-demand
# by security analysts from Splunk Enterprise Security (ES) Incident Review.
# ----------------------------------------------------------------------------

[send_to_fusion]
# python.version = python3
# Why: Forces Splunk Enterprise to run the backend script (bin/send_to_fusion.py)
# using its modern Python 3 runtime rather than legacy Python 2.
python.version = python3

# python.required = 3.9, 3.13
# Why: Declares compatibility with Splunk Enterprise 9.x/10.x and Splunk Cloud
# requirements, verifying that the script is tested and supported on Python 3.9
# through Python 3.13 without deprecation issues.
python.required = 3.9, 3.13

# is_custom = 1
# Why: Flags this action as a custom modular alert action so Splunk displays
# it in Alert Action lists and permits custom parameter passing.
is_custom = 1

# label and description:
# Why: User-facing text shown in Splunk Enterprise Security when analysts
# choose which action to run on a Notable Event or Detection rule.
label = Send to CrowdStrike Fusion
description = Sends notable events to CrowdStrike Falcon Fusion SOAR or Next-Gen SIEM

# icon_path = alerticon.png
# Why: Custom icon rendered next to the action name in the UI, located at
# appserver/static/alerticon.png.
icon_path = alerticon.png

# payload_format = json
# Why: Instructs Splunk to feed the alert configuration and search results into
# the script's standard input (stdin) as structured JSON instead of legacy XML.
# JSON is much faster and more reliable to parse in Python.
payload_format = json

# Default action parameter values (can be overridden per detection rule):
# ----------------------------------------------------------------------
# param.delivery_method: Specifies whether to trigger a Fusion SOAR workflow
# ('fusion_workflow'), ingest into Falcon Next-Gen SIEM ('ngsiem_hec'), or both.
param.delivery_method = fusion_workflow

# param.workflow: Optional workflow name or 32-character definition ID override.
# When left empty, the script automatically uses default_workflow from the app setup.
param.workflow =

# param.comment: Optional comment from the analyst or detection rule providing context.
param.comment =

# param._cam: Common Action Model (CAM) Metadata for Splunk Enterprise Security
# ------------------------------------------------------------------------------
# Why: Enterprise Security (ES) uses CAM metadata to validate capabilities and
# render this alert action inside the Incident Review / Analyst Queue UI.
# Setting "supports_adhoc": true is specifically what allows a SOC analyst to
# click "Run Adaptive Response Action" manually on any notable finding.
param._cam = {"task": ["create", "update"], "subject": ["threat.incident", "endpoint"], "category": ["Information Conveyance", "Orchestration"], "technology": [{"vendor": "CrowdStrike", "product": "Falcon Fusion SOAR", "version": ["1.0"]}], "supports_adhoc": true}
