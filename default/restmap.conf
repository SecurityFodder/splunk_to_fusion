# restmap.conf: REST Endpoint Handler Mapping
# ----------------------------------------------------------------------------
# In Splunk, restmap.conf registers custom REST API endpoints that can be
# called via HTTP or SplunkJS from dashboards, setup pages, or scripts.
#
# This endpoint powers the Splunk-to-Fusion Security Broker (s2f_broker.py),
# which bridges requests from the setup GUI and modular alert executions.
# ----------------------------------------------------------------------------

[script:s2f_broker]
# match = /ta_s2f/broker
# Why: Defines the URL path relative to /services (e.g., /services/ta_s2f/broker).
match = /ta_s2f/broker

# script = s2f_broker.py
# Why: Names the Python script located in bin/ that handles requests to this endpoint.
script = s2f_broker.py

# scripttype = persist
# Why: Keeps the Python process running in memory across requests instead of
# spinning up a new process each time. This allows the script to cache OAuth2
# access tokens in memory for 25 minutes, drastically cutting API calls to CrowdStrike.
scripttype = persist

# handler = s2f_broker.S2FBrokerHandler
# Why: Specifies the Python class inside s2f_broker.py that implements the handler logic.
handler = s2f_broker.S2FBrokerHandler

# python.version = python3 & python.required = 3.9, 3.13
# Why: Enforces execution with modern Python 3 and documents platform compatibility.
python.version = python3
python.required = 3.9, 3.13

# output_modes = json
# Why: Guarantees that responses returned to the web browser or caller are JSON.
output_modes = json

# passPayload = true
# Why: Passes the raw HTTP request body (e.g. JSON submitted by the Setup page
# or the alert action) directly to the Python handler.
passPayload = true

# passSystemAuth = true
# Why: CRITICAL SECURITY SETTING. Provides the script with an internal system-level
# auth token (system_authtoken) in addition to the user's session token.
# This allows the script to read encrypted credentials from Splunk's storage/passwords
# without needing the calling analyst user to have the 'list_storage_passwords' capability.
passSystemAuth = true

# passHttpHeaders = true
# Why: Provides the script with incoming HTTP request headers so it can verify
# the user's caller session and handle authentication securely.
passHttpHeaders = true

# capability.get = s2f_send & capability.post = s2f_send
# Why: Splunk's built-in RBAC gatekeeper. Any user calling GET or POST on this
# endpoint must have at least the 's2f_send' capability. Calls from unauthenticated
# or unauthorized users are blocked at the web server layer before reaching Python.
capability.get = s2f_send
capability.post = s2f_send
