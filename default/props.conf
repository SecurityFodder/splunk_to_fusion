# props.conf: Field Extraction and Line Breaking Configuration
# ----------------------------------------------------------------------------
# In Splunk, props.conf tells indexers and search heads how to parse incoming
# data and how to extract fields from logs at search time.
#
# This add-on writes JSON-formatted status and error logs to splunkd.log with
# sourcetype=send_to_fusion (or modular_alerts:send_to_fusion).
# ----------------------------------------------------------------------------

[send_to_fusion]
# SHOULD_LINEMERGE = false
# Why: Every log line emitted by the alert action script is an independent,
# single-line JSON event. Setting SHOULD_LINEMERGE to false prevents Splunk
# from wasting CPU cycles checking if consecutive lines belong together.
SHOULD_LINEMERGE = false

# KV_MODE = auto
# Why: Instructs Splunk to automatically parse key="value" pairs and JSON fields
# in the log message at search time. This enables fields like 'action', 'status',
# 'event_id', and 'workflow_id' to appear automatically in Splunk search results
# without writing manual regular expression extractions.
KV_MODE = auto

[modular_alerts:send_to_fusion]
# Why: When Splunk executes a modular alert, it automatically prefixes the
# sourcetype with "modular_alerts:". These duplicate settings ensure the exact
# same line-breaking and automatic field extraction rules apply regardless
# of whether Splunk uses the prefixed or unprefixed sourcetype name.
SHOULD_LINEMERGE = false
KV_MODE = auto
