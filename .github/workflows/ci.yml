name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests & package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: make test

      - name: Build package
        run: make package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ta-splunk-to-fusion-py${{ matrix.python-version }}
          path: TA-splunk_to_fusion-*.tar.gz
          if-no-files-found: error

  appinspect:
    name: Splunk AppInspect
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AppInspect
        run: pip install splunk-appinspect

      - name: Build package
        run: make package

      - name: Run AppInspect
        run: make appinspect

      - name: Upload AppInspect report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appinspect-report
          path: appinspect_report.json
